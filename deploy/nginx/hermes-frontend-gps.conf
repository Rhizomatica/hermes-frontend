# HERMES GPS — HTTPS :4001 -> 127.0.0.1:4101
# Also serves the offline map tile from the release root.
server {
    listen 4001 ssl;
    server_name __STATION_NAME__;

    ssl_certificate     __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location = /ws {
        proxy_pass https://127.0.0.1:8080/api/v2/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_ssl_server_name on;
        proxy_ssl_name __STATION_NAME__;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
    }

    location = /brazil.pmtiles {
        root __TILES_ROOT__;
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
