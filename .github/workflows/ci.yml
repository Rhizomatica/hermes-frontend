name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm test -- --coverage
      - name: Check coverage thresholds
        run: |
          echo "Coverage report generated. Thresholds enforced in vitest.config.ts"

  build-verify:
    name: Build (verify)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [hermes-shell, hermes-gps-final, hermes-chat-final]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx turbo build --filter=${{ matrix.app }}
      - name: Verify standalone output exists
        run: test -d apps/${{ matrix.app }}/.next/standalone

  e2e:
    name: E2E Tests
    needs: [build-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [hermes-shell]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx turbo build --filter=${{ matrix.app }}
      - name: Start app in background
        run: |
          cd apps/${{ matrix.app }}
          node .next/standalone/apps/${{ matrix.app }}/server.js &
          sleep 5
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000
      - name: Run Playwright E2E
        run: npx playwright test --project=chromium
        working-directory: apps/${{ matrix.app }}
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results/

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx turbo build
      - name: Check bundle sizes
        run: |
          for app in hermes-shell hermes-gps-final hermes-chat-final; do
            SIZE=$(du -sk apps/$app/.next/standalone | cut -f1)
            echo "$app standalone: ${SIZE}KB"
            if [ "$SIZE" -gt 150000 ]; then
              echo "::warning::$app standalone exceeds 150MB budget (${SIZE}KB)"
            fi
          done