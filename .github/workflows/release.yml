name: Release (ARM64 Build + Deploy)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-arm64:
    name: Build ARM64 artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package standalone artifacts
        run: |
          scripts/build-frontend-arm64.sh \
            --version "${{ steps.version.outputs.version }}" \
            --out dist

      - name: Show artifacts
        run: ls -lh dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-frontend-${{ steps.version.outputs.version }}-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/manifest-*.json
          retention-days: 30

      - name: Upload to GitHub Release (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/manifest-*.json
          generate_release_notes: true

  deploy-staging:
    name: Deploy to Staging sBitx
    needs: [build-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Deploy to staging sBitx
        run: |
          echo "Deploying to staging sBitx..."
          echo "This step requires:"
          echo "  1. SSH key configured in GitHub Secrets (SBITX_STAGING_SSH_KEY)"
          echo "  2. Staging sBitx hostname in GitHub Secrets (SBITX_STAGING_HOST)"
          echo "  3. systemd service files on the sBitx: hermes-shell, hermes-gps, hermes-chat"
          echo ""
          echo "Deploy command (uncomment when secrets are configured):"
          echo "# for app in hermes-shell hermes-gps hermes-chat-final; do"
          echo "#   scp artifacts/\${app}-arm64/*.tar.gz \${SBITX_STAGING_HOST}:/opt/hermes/"
          echo "#   ssh \${SBITX_STAGING_HOST} 'cd /opt/hermes && tar -xzf \${app}.tar.gz && systemctl restart hermes-\${app}'"
          echo "# done"

  deploy-production:
    name: Deploy to Production sBitx
    needs: [build-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Deploy to production
        run: |
          echo "Deploying to production sBitx..."
          echo "This step requires:"
          echo "  1. SSH key configured in GitHub Secrets (SBITX_PROD_SSH_KEY)"
          echo "  2. Production sBitx hostname in GitHub Secrets (SBITX_PROD_HOST)"
          echo ""
          echo "Deploy command (uncomment when secrets are configured):"
          echo "# for app in hermes-shell hermes-gps hermes-chat-final; do"
          echo "#   scp artifacts/\${app}-arm64/*.tar.gz \${SBITX_PROD_HOST}:/opt/hermes/"
          echo "#   ssh \${SBITX_PROD_HOST} 'cd /opt/hermes && tar -xzf \${app}.tar.gz && systemctl restart hermes-\${app}'"
          echo "# done"
