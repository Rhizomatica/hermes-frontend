services:
  hermes-chat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: hermes-chat-final
        PORT: "3000"
    image: hermes-chat:latest
    ports:
      - "3000:3000"
    environment:
      HERMES_API_URL: ${HERMES_API_URL}
    restart: unless-stopped

  hermes-gps:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: hermes-gps-final
        PORT: "3001"
    image: hermes-gps:latest
    ports:
      - "3001:3001"
    environment:
      HERMES_API_URL: ${HERMES_API_URL}
    volumes:
      # brazil.pmtiles is too large to bake into the image — mount from the host.
      # Run  npm run download-tiles  inside apps/hermes-gps-final/ first.
      - ./apps/hermes-gps-final/public/brazil.pmtiles:/app/apps/hermes-gps-final/public/brazil.pmtiles:ro
    restart: unless-stopped